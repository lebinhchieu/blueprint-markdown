<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Blueprint navy background with subtle rounded corners -->
  <rect width="128" height="128" rx="20" fill="#1B3054"/>
  <!-- Classic markdown M shape -->
  <polyline
    points="16,94 16,34 48,66 80,34 80,94"
    stroke="white" stroke-width="12"
    stroke-linejoin="round" stroke-linecap="round"
    fill="none"/>
  <!-- Down arrow: vertical bar -->
  <rect x="96" y="34" width="12" height="38" rx="3" fill="white"/>
  <!-- Down arrow: triangle pointing down -->
  <polygon points="86,72 122,72 104,94" fill="white"/>
</svg>
