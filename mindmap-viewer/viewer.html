<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mindmap Viewer</title>
<link rel="stylesheet" href="../media/reset.css" />
<link rel="stylesheet" href="../media/tokens.css" />
<link rel="stylesheet" href="../media/base.css" />
<link rel="stylesheet" href="../media/components.css" />
<link rel="stylesheet" href="../media/em-theme.css" />
<link rel="stylesheet" href="../media/fonts.css" />
<link rel="stylesheet" href="../media/hljs.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg-base); }

  .viewer-header {
    display: flex;
    align-items: center;
    gap: var(--sp-md);
    padding: var(--sp-sm) var(--sp-lg);
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-raised);
    flex-shrink: 0;
  }
  .viewer-header h1 {
    font-size: var(--font-size-lg);
    margin: 0;
    color: var(--text-base);
    font-family: var(--font-display);
  }
  .viewer-header .spacer { flex: 1; }
  .viewer-header button {
    font-family: var(--font-sans);
    font-size: var(--font-size-sm);
    padding: var(--sp-xs) var(--sp-md);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    background: var(--bg-overlay);
    color: var(--text-base);
    cursor: pointer;
  }
  .viewer-header button:hover { background: var(--bg-surface); }
  .viewer-header select {
    font-family: var(--font-sans);
    font-size: var(--font-size-sm);
    padding: var(--sp-xs) var(--sp-sm);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    background: var(--bg-overlay);
    color: var(--text-base);
  }
  #status { font-size: var(--font-size-sm); color: var(--text-muted); }
  .viewer-hint {
    padding: var(--sp-xs) var(--sp-lg);
    font-size: var(--font-size-sm);
    color: var(--text-muted);
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
  }

  main {
    flex: 1;
    display: flex;
    min-height: 0;
    padding: var(--sp-lg);
  }
  #mindmap-root {
    flex: 1;
    height: auto;
  }
  #mindmap-root:empty {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #mindmap-root:empty::before {
    content: 'Drop a .md file onto this window, or click "Load sample".';
    color: var(--text-muted);
    font-family: var(--font-sans);
  }
  #drop-zone.is-dragover #mindmap-root {
    outline: 2px dashed var(--c-primary);
    outline-offset: -2px;
  }
</style>
</head>
<body class="md-output">
  <div class="viewer-header">
    <h1>Mindmap Viewer</h1>
    <span id="status"></span>
    <div class="spacer"></div>
    <select id="layout-select">
      <option value="dagre">Layout: Tree</option>
      <option value="concentric">Layout: Concentric</option>
    </select>
    <button type="button" id="fit-view">Fit</button>
    <button type="button" id="load-sample">Load sample</button>
    <button type="button" onclick="document.getElementById('file-input').click()">Load file…</button>
    <input type="file" id="file-input" accept=".md,.markdown,text/markdown" hidden />
  </div>
  <div class="viewer-hint">Click a node for details · right-click to collapse/expand · hover to trace a path</div>
  <main id="drop-zone">
    <div id="mindmap-root" class="em-mindmap"></div>
  </main>
  <script src="dist/main.js"></script>
</body>
</html>
